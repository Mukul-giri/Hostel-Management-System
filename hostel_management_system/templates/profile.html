{% extends 'base.html' %}{% block title %}My Profile{% endblock %}{% block content %}<div class="page-heading"><span class="eyebrow">STUDENT ACCOUNT</span><h1>My profile</h1><p>Keep your contact and guardian details up to date.</p></div><form method="post" class="content-card"><div class="row g-3"><div class="col-md-6"><label class="form-label">Student ID</label><input class="form-control" value="{{ student.student_id }}" disabled></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" value="{{ student.email }}" disabled></div><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" value="{{ student.name }}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ student.phone or '' }}"></div><div class="col-md-4"><label class="form-label">Gender</label><select class="form-select" name="gender"><option value="">Select</option>{% for g in ['Male','Female','Other','Prefer not to say'] %}<option {% if student.gender==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Course</label><input class="form-control" name="course" value="{{ student.course or '' }}"></div><div class="col-md-4"><label class="form-label">Branch</label><input class="form-control" name="branch" value="{{ student.branch or '' }}"></div><div class="col-md-4"><label class="form-label">Year</label><select class="form-select" name="year"><option value="">Select year</option>{% for y in range(1,6) %}<option value="{{ y }}" {% if student.year==y %}selected{% endif %}>Year {{ y }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Guardian name</label><input class="form-control" name="guardian_name" value="{{ student.guardian_name or '' }}"></div><div class="col-md-4"><label class="form-label">Guardian phone</label><input class="form-control" name="guardian_phone" value="{{ student.guardian_phone or '' }}"></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="3">{{ student.address or '' }}</textarea></div></div><div class="mt-4"><button class="btn btn-primary">Save changes</button></div></form>{% endblock %}
