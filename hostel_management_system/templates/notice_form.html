{% extends 'base.html' %}{% block title %}Edit Notice{% endblock %}{% block content %}<div class="page-heading"><span class="eyebrow">COMMUNICATION</span><h1>Edit notice</h1><p>Update the announcement visible to students.</p></div><form method="post" class="content-card"><div class="mb-3"><label class="form-label">Title</label><input class="form-control" name="title" maxlength="180" value="{{ notice.title }}" required></div><div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="6" required>{{ notice.description }}</textarea></div><button class="btn btn-primary">Save changes</button> <a class="btn btn-light" href="{{ url_for('manage_notices') }}">Cancel</a></form>{% endblock %}
