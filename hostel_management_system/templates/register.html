{% extends 'base.html' %}{% block title %}Student Registration{% endblock %}{% block content %}<div class="form-shell"><div class="mb-4"><span class="eyebrow">STUDENT PORTAL</span><h1 class="fw-bold mt-2">Create your account</h1><p class="text-secondary">Enter your basic details. You can update your profile after signing in.</p></div><form method="post" class="content-card"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name *</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Student ID *</label><input class="form-control" name="student_id" required></div><div class="col-md-6"><label class="form-label">Username *</label><input class="form-control" name="username" required></div><div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label class="form-label">Password * (8+ characters)</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-md-4"><label class="form-label">Course</label><input class="form-control" name="course" placeholder="B.Tech"></div><div class="col-md-4"><label class="form-label">Branch</label><input class="form-control" name="branch" placeholder="AI/ML"></div><div class="col-md-4"><label class="form-label">Year</label><select class="form-select" name="year"><option value="">Select year</option>{% for y in range(1,6) %}<option value="{{ y }}">Year {{ y }}</option>{% endfor %}</select></div></div><div class="mt-4 d-flex align-items-center gap-3"><button class="btn btn-primary btn-lg">Register account</button><span class="text-secondary small">Already registered? <a href="{{ url_for('login') }}">Login</a></span></div></form></div>{% endblock %}
