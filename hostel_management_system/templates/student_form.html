{% extends 'base.html' %}{% block title %}{{ 'Edit Student' if student else 'Add Student' }}{% endblock %}{% block content %}<div class="page-heading"><span class="eyebrow">ADMINISTRATION</span><h1>{{ 'Edit student' if student else 'Add student' }}</h1><p>Maintain student identity and contact details.</p></div><form method="post" class="content-card"><div class="row g-3"><div class="col-md-4"><label class="form-label">Student ID *</label><input class="form-control" name="student_id" value="{{ student.student_id if student else '' }}" required></div><div class="col-md-4"><label class="form-label">Full name *</label><input class="form-control" name="name" value="{{ student.name if student else '' }}" required></div><div class="col-md-4"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" value="{{ student.email if student else '' }}" required></div><div class="col-md-4"><label class="form-label">Username {% if not student %}*{% endif %}</label><input class="form-control" name="username" value="{{ student.user.username if student else '' }}" {% if not student %}required{% endif %}></div><div class="col-md-4"><label class="form-label">Password {% if not student %}(default: ChangeMe123!){% else %}(leave blank to keep current){% endif %}</label><input class="form-control" type="password" name="password" minlength="8"></div><div class="col-md-4"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ student.phone if student else '' }}"></div><div class="col-md-4"><label class="form-label">Gender</label><select class="form-select" name="gender"><option value="">Select</option>{% for g in ['Male','Female','Other'] %}<option {% if student and student.gender==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Course</label><input class="form-control" name="course" value="{{ student.course if student else '' }}"></div><div class="col-md-4"><label class="form-label">Branch</label><input class="form-control" name="branch" value="{{ student.branch if student else '' }}"></div><div class="col-md-4"><label class="form-label">Year</label><select class="form-select" name="year"><option value="">Select year</option>{% for y in range(1,6) %}<option value="{{ y }}" {% if student and student.year==y %}selected{% endif %}>Year {{ y }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Guardian name</label><input class="form-control" name="guardian_name" value="{{ student.guardian_name if student else '' }}"></div><div class="col-md-4"><label class="form-label">Guardian phone</label><input class="form-control" name="guardian_phone" value="{{ student.guardian_phone if student else '' }}"></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" rows="3" name="address">{{ student.address if student else '' }}</textarea></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Save student</button><a class="btn btn-light" href="{{ url_for('manage_students') }}">Cancel</a></div></form>{% endblock %}
