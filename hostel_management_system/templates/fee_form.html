{% extends 'base.html' %}{% block title %}Edit Fee{% endblock %}{% block content %}<div class="page-heading"><span class="eyebrow">FINANCE</span><h1>Edit fee record #{{ fee.id }}</h1><p>{{ fee.student.name }} · {{ fee.student.student_id }}</p></div><form method="post" class="content-card"><div class="row g-3"><div class="col-md-4"><label class="form-label">Amount (₹)</label><input class="form-control" type="number" name="amount" min="0.01" step="0.01" value="{{ fee.amount }}" required></div><div class="col-md-4"><label class="form-label">Due date</label><input class="form-control" type="date" name="due_date" value="{{ fee.due_date.isoformat() }}" required></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status">{% for s in ['Pending','Paid','Overdue'] %}<option {% if fee.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Payment date</label><input class="form-control" type="date" name="payment_date" value="{{ fee.payment_date.isoformat() if fee.payment_date else '' }}"></div><div class="col-md-4"><label class="form-label">Payment method</label><select class="form-select" name="payment_method"><option value="">Not recorded</option>{% for m in ['Cash','UPI','Bank Transfer','Card','Cheque','Other'] %}<option {% if fee.payment_method==m %}selected{% endif %}>{{ m }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Transaction ID / receipt no.</label><input class="form-control" name="transaction_id" value="{{ fee.transaction_id or '' }}"></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Save changes</button><a class="btn btn-light" href="{{ url_for('manage_fees') }}">Cancel</a></div></form>{% endblock %}
