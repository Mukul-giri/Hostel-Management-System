{% extends 'base.html' %}{% block title %}{{ 'Edit Room' if room else 'Add Room' }}{% endblock %}{% block content %}<div class="page-heading"><span class="eyebrow">ACCOMMODATION</span><h1>{{ 'Edit room' if room else 'Add room' }}</h1><p>Set the room details and total bed capacity.</p></div><form method="post" class="content-card"><div class="row g-3"><div class="col-md-6"><label class="form-label">Room number *</label><input class="form-control" name="room_number" value="{{ room.room_number if room else '' }}" required></div><div class="col-md-6"><label class="form-label">Block *</label><input class="form-control" name="block" value="{{ room.block if room else '' }}" placeholder="A Block" required></div><div class="col-md-4"><label class="form-label">Floor</label><input class="form-control" type="number" name="floor" min="0" value="{{ room.floor if room else 0 }}"></div><div class="col-md-4"><label class="form-label">Room type</label><select class="form-select" name="room_type">{% for t in ['Single','Double','Triple','Dormitory'] %}<option {% if room and room.room_type==t %}selected{% elif not room and t=='Double' %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Bed capacity *</label><input class="form-control" type="number" name="capacity" min="1" value="{{ room.capacity if room else 2 }}" required></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Save room</button><a class="btn btn-light" href="{{ url_for('manage_rooms') }}">Cancel</a></div></form>{% endblock %}
